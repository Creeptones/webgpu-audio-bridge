name: browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kept separate from test.yml so the Node matrix stays green while we iterate on
# the browser smoke. This job is allowed to fail without blocking, until we've
# tuned it on real CI hardware — once it's stable, drop the continue-on-error
# below.

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:browser
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
