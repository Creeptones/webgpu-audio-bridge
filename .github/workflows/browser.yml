name: browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 0.9.33 — the browser smoke is now gating CI across Chromium + Firefox +
# WebKit (was Chromium-only and `continue-on-error: true` through 0.9.32).
# Each matrix slot installs only its own browser's binaries to keep job
# runtime bounded. `fail-fast: false` so one engine regressing doesn't
# mask the others; each slot uploads a uniquely-named report on failure.

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: browser-smoke (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Install Playwright (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Headless Firefox on Linux renders Web Audio through PulseAudio; the
      # hosted runner has no sound server, so every AudioContext stays
      # 'suspended' forever (resume() never settles, worklets never run).
      # Chromium/WebKit use built-in fake sinks headless. A null sink gives
      # Firefox a real (silent) output device. Diagnosed via the
      # jit-vectorize spec's timeout snapshot (ctxState: suspended).
      - name: Virtual audio sink (Firefox)
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl info | grep -E 'Server Name|Default Sink'
      - name: Browser smoke
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
