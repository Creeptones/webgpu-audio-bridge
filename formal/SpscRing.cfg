\* TLC configuration for the SpscRing SPSC protocol model.
\*
\* Small bounded session so TLC's state-space is finite and exhausts in
\* seconds:
\*   - CAPACITY  = 2   : minimal ring that still distinguishes empty/full
\*                       and forces slot reuse (slot = idx % 2).
\*   - CAP2_32   = 16  : the modeled counter modulus.  A SMALL power of two
\*                       (NOT 2^32) so the Int32 wrap boundary is actually
\*                       crossed inside MAXFRAMES and TLC explores the
\*                       (idx + 1) % modulus rollover plus the SignedDiff /
\*                       Slot re-centering algebra at model scale.
\*   - MAXFRAMES = 6   : long enough to wrap readIdx/writeIdx past CAP2_32
\*                       at least... well past CAPACITY many times, exercising
\*                       slot reuse and the buffered<=CAPACITY contract.
\*
\* Re-run with CAPACITY=3, CAP2_32=8 to vary the wrap cadence; the
\* invariants are CAPACITY/modulus-agnostic.

SPECIFICATION Spec

CONSTANTS
    CAPACITY  = 2
    CAP2_32   = 16
    MAXFRAMES = 6

\* ─────────────────────────── SAFETY ───────────────────────────
INVARIANT NoOverwrite
INVARIANT NoTornRead
INVARIANT FifoMonotone
INVARIANT Conservation

\* ─────────────────────────── LIVENESS ─────────────────────────
\* Requires WF_vars(Producer) /\ WF_vars(Consumer); the `fair process`
\* declarations in SpscRing.tla make the PlusCal translator emit those
\* fairness conjuncts into Spec.
PROPERTY WakeLivenessProducer
PROPERTY WakeLivenessConsumer

\* The PlusCal `assert` statements (NoTornRead witness in CommitR) are
\* checked by TLC automatically.  CHECK_DEADLOCK is left on (default): because
\* both driver loops are infinite (work gated by produced/consumed < MAXFRAMES
\* rather than by loop termination), no peer ever reaches the `Done` label, so
\* the all-Done terminal state cannot raise a spurious deadlock — only a
\* genuine wedge (both peers stuck) would surface as a deadlock counterexample.
