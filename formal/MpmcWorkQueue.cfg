\* TLC configuration for the MP->MC competing-consumer WORK QUEUE protocol model
\* (Apollo Frontier 3, MP->MC work-queue Stage 0, 2026-05-31).  Small bounded
\* session so TLC's state space is finite and exhausts quickly:
\*
\*   - NPRODUCERS = 2   : the minimal multi-producer fan-in; the producers'
\*                        Claim/Write/Publish steps interleave freely (incl.
\*                        out-of-order Publish).
\*   - NCONSUMERS = 2   : THE NEW AXIS -- the minimal COMPETING-consumer config.
\*                        Two consumers fetch-add the shared dequeueTicket and
\*                        must partition the stream with no double-deliver; the
\*                        UniqueClaim invariant is the whole point.  Re-run with
\*                        NCONSUMERS = 3 to widen consumer contention.
\*   - CAPACITY   = 2   : minimal ring that distinguishes empty/full and forces
\*                        slot reuse across laps (slot = ticket % 2).
\*   - CAP2_32    = 16  : the modeled counter modulus.  A SMALL power of two (NOT
\*                        2^32) so the Int32 wrap boundary is crossed inside the
\*                        session and TLC exercises the (idx+1) % modulus rollover
\*                        plus the SignedDiff / Slot re-centering at model scale.
\*                        > 2*CAPACITY and > MAXFRAMES (the ASSUMEs enforce both).
\*   - MAXFRAMES  = 4   : enough total claims to reuse every slot across laps and
\*                        force the held-claim / out-of-order-completion paths
\*                        while keeping the state space small.
\*
\* Re-run with NCONSUMERS=3, NPRODUCERS=2, MAXFRAMES=6 (or CAPACITY=4) to vary the
\* consumer contention and wrap cadence; the invariants are N*/CAPACITY/modulus
\* agnostic.

SPECIFICATION Spec

CONSTANTS
    NPRODUCERS = 2
    NCONSUMERS = 2
    CAPACITY   = 2
    CAP2_32    = 16
    MAXFRAMES  = 4

\* ─────────────────────────── SAFETY ───────────────────────────
INVARIANT NoOverwrite
INVARIANT NoTornRead
INVARIANT UniqueClaim
INVARIANT UniqueDelivery
INVARIANT Conservation

\* ─────────────────────────── LIVENESS ─────────────────────────
\* Require WF_vars(Producer)/WF_vars(Consumer); the `fair process` declarations
\* in MpmcWorkQueue.tla make the PlusCal translator emit those fairness conjuncts
\* into Spec.
PROPERTY EventuallyDrained
PROPERTY HeadProgress

\* The PlusCal `assert` statements (the NoTornRead + no-wrong-frame + no-double-
\* deliver witnesses in the consumer's Verify step, and the d>0 unreachability
\* assert) are checked by TLC automatically.  CHECK_DEADLOCK is left on (default):
\* all driver loops are infinite (work gated by claimed/consumed < MAXFRAMES, not
\* by loop termination), so no process reaches `Done` and the idle terminal state
\* cannot raise a spurious deadlock -- only a genuine wedge would surface.
