\* TLC configuration for the MpmcRing MP->SC protocol model (Apollo Frontier 3,
\* Stage 0, patch 0.9.906).  Small bounded session so TLC's state space is
\* finite and exhausts quickly:
\*
\*   - NPRODUCERS = 2   : the minimal multi-producer fan-in; the two producers'
\*                        Claim/Write/Publish steps interleave freely (including
\*                        out-of-order Publish), which is the whole point.
\*                        Re-run with NPRODUCERS = 3 to widen the fan-in.
\*   - CAPACITY   = 2   : minimal ring that distinguishes empty/full and forces
\*                        slot reuse across laps (slot = ticket % 2).
\*   - CAP2_32    = 16  : the modeled counter modulus.  A SMALL power of two
\*                        (NOT 2^32) so the Int32 wrap boundary is crossed inside
\*                        MAXFRAMES and TLC exercises the (idx+1) % modulus
\*                        rollover plus the SignedDiff / Slot re-centering at
\*                        model scale.  > 2*CAPACITY keeps the live generation
\*                        span clear of the +/-(CAP2_32/2) ambiguity boundary
\*                        (the ASSUME enforces this).
\*   - MAXFRAMES  = 4   : enough total claims to reuse every slot across laps
\*                        while keeping the state space small.
\*
\* Re-run with NPRODUCERS=3, CAPACITY=2, MAXFRAMES=6 (or CAPACITY=4) to vary the
\* fan-in and wrap cadence; the invariants are NPRODUCERS/CAPACITY/modulus
\* agnostic.

SPECIFICATION Spec

CONSTANTS
    NPRODUCERS = 2
    CAPACITY   = 2
    CAP2_32    = 16
    MAXFRAMES  = 4

\* ─────────────────────────── SAFETY ───────────────────────────
INVARIANT NoOverwrite
INVARIANT NoTornRead
INVARIANT FifoByTicketNoGap
INVARIANT Conservation

\* ─────────────────────────── LIVENESS ─────────────────────────
\* Require WF_vars(Producer)/WF_vars(Consumer); the `fair process` declarations
\* in MpmcRing.tla make the PlusCal translator emit those fairness conjuncts
\* into Spec.
PROPERTY EventuallyDrained
PROPERTY HeadProgress

\* The PlusCal `assert` statements (the NoTornRead + no-wrong-frame witnesses in
\* the consumer's Dequeue step) are checked by TLC automatically.  CHECK_DEADLOCK
\* is left on (default): both driver loops are infinite (work gated by
\* claimed/consumed < MAXFRAMES rather than by loop termination), so no process
\* reaches `Done` and the all-Done terminal state cannot raise a spurious
\* deadlock -- only a genuine wedge would surface as a counterexample.
