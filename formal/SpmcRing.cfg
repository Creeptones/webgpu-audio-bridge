\* TLC configuration for the SpmcRing SP->MC broadcast protocol model (Apollo
\* Frontier 3, Stage 4.0, patch 0.9.910).  Small bounded session so TLC's state
\* space is finite and exhausts quickly:
\*
\*   - CONSUMERS = 2   : the minimal multi-consumer fan-out; the two consumers'
\*                       Gate/Commit steps interleave freely with each other AND
\*                       with the producer's Busy/Publish steps, which is the
\*                       whole point (independent cursors, the seqlock window
\*                       open on one consumer while the producer laps).  Re-run
\*                       with CONSUMERS = 3 to widen the fan-out.
\*   - CAPACITY  = 2   : minimal ring that distinguishes empty/full and forces
\*                       slot reuse across laps (slot = ticket % 2), so the
\*                       producer laps a slow consumer and the torn-read window
\*                       actually opens.
\*   - CAP2_32   = 16  : the modeled counter modulus.  A SMALL power of two (NOT
\*                       2^32) so the Int32 wrap boundary is exercised at model
\*                       scale.  The seqlock encodes generations at 2*ticket
\*                       (+1 busy), so the live span is ~2*CAPACITY; CAP2_32 must
\*                       exceed 4*CAPACITY (the ASSUME enforces it) to keep the
\*                       live generation span clear of the +/-(CAP2_32/2)
\*                       ambiguity boundary.  16 > 4*2 = 8.
\*   - MAXFRAMES = 4   : enough total writes to reuse every slot across laps
\*                       (so a lap-behind consumer's seqlock window is exercised)
\*                       while keeping the state space small.
\*
\* Re-run with CONSUMERS=3 (and/or MAXFRAMES=5,6) to widen the fan-out / wrap
\* cadence; with CAPACITY=4 set CAP2_32=32 (the > 4*CAPACITY ASSUME).  The
\* invariants are CONSUMERS/CAPACITY/modulus agnostic.

SPECIFICATION Spec

CONSTANTS
    CONSUMERS = 2
    CAPACITY  = 2
    CAP2_32   = 16
    MAXFRAMES = 4

\* ─────────────────────────── SAFETY ───────────────────────────
INVARIANT NoTornRead
INVARIANT PerConsumerFifo
INVARIANT Conservation

\* ─────────────────────────── LIVENESS ─────────────────────────
\* Require WF_vars(Producer)/WF_vars(Consumer); the `fair process` declarations
\* in SpmcRing.tla make the PlusCal translator emit those fairness conjuncts
\* into Spec.
PROPERTY EventuallyDrained
PROPERTY HeadProgress

\* The PlusCal `assert` statements (the per-consumer NoTornRead witness
\* `assert ~cDirty[self]` and the no-wrong-frame / broadcast-consistency witness
\* `assert cRead[self] = Mod(D)`, both in the consumer's Commit step) are checked
\* by TLC automatically.  CHECK_DEADLOCK is left on (default): both driver loops
\* are infinite (work gated by writeTicket / delivered+dropped < MAXFRAMES rather
\* than by loop termination), so no process reaches `Done` and the all-Done
\* terminal state cannot raise a spurious deadlock -- only a genuine wedge would
\* surface as a counterexample.
